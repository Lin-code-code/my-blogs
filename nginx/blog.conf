# 反向代理层：对外只开 80，后端 8000 只在 compose 内网可达
# Netlify 代理过来的请求带 X-Forwarded-For，取第一段当真实客户端 IP
# shortcut: XFF 第一段客户端可伪造，只够防误用和暴力登录，挡不住有意绕过
map $http_x_forwarded_for $client_ip {
    ~^(?<ip>[0-9a-fA-F:.]+)  $ip;
    default                  $remote_addr;
}

limit_req_zone $client_ip zone=api:10m rate=20r/s;
limit_req_zone $client_ip zone=login:10m rate=5r/m;

server {
    listen 80;
    server_name _;

    # Netlify 转发时会带 X-Forwarded-Proto: https，透传会让 Django 以为自己在 HTTPS 后面，
    # 于是给 Session/CSRF Cookie 加 Secure；浏览器这侧是 HTTP，Cookie 存不下来，登录态会丢。
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    limit_req_status 429;

    # 登录接口单独限流，防暴力破解
    location = /api/v1/auth/login/ {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://blogs-app:8000;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://blogs-app:8000;
    }

    # Django Admin 与它的静态文件（WhiteNoise）也走这一层，否则关了 8000 就访问不到
    location / {
        proxy_pass http://blogs-app:8000;
    }
}