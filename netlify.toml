[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # Netlify 站点部署在根路径，需要覆盖 GitHub Pages 使用的仓库子路径
  VITE_BASE_PATH = "/"

# 前端同源请求 /api/*，由 Netlify 代理到服务器上的 nginx（80 端口），避免跨站 Cookie 被浏览器拦截
# 后端 8000 只在内网可达，对外一律走 nginx；部署前把下面的 IP 换成服务器公网 IP
[[redirects]]
  from = "/api/*"
  to = "http://120.79.140.122/api/:splat"
  status = 200
  force = true
